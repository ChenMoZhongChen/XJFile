org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ★ 为什么 aapt2 不用 Gradle 缓存里那一份：
#   Gradle 主目录已经搬进工作区（K:\XjFile\.gradle-home，见 PHASE3_HANDOFF §1），
#   而 aapt2 这个可执行文件只要**从工作区内运行**，在本机沙箱下就写不了输出文件
#   （报 `stableIds.txt: failed to open: 数据无效 (13)`，构建直接挂）。放到工作区外就正常。
#   所以：缓存留在工作区，aapt2 单独在外面放一份，用下面这个属性指过去。
android.aapt2FromMavenOverride=K:/aapt2/aapt2.exe
